<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0788ff"><meta name="description" content="Connect Store — clientes, vendas, parcelas e pagamentos"><link rel="manifest" href="manifest.json"><link rel="icon" href="logo.png"><title>Connect Store</title><style>
:root{--bg:#05070b;--panel:#0c111a;--panel2:#111927;--line:#1d2b3d;--text:#f4f8ff;--muted:#8fa3b9;--blue:#08a8ff;--blue2:#176dff;--green:#25d889;--red:#ff5d6c;--yellow:#ffc857;--shadow:0 14px 40px #0008}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#073a63 0,#07101b 35%,var(--bg) 70%);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;min-height:100vh}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:1180px;margin:auto;padding:18px 16px 100px}.top{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:18px}.brand{display:flex;align-items:center;gap:10px}.brand img{width:54px;height:54px;object-fit:cover;border-radius:14px}.brand h1{font-size:20px;margin:0}.brand small{color:var(--muted)}.actions{display:flex;gap:8px}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:10px 13px;border-radius:11px}.btn.primary{background:linear-gradient(135deg,var(--blue),var(--blue2));border:0;font-weight:700}.btn.danger{border-color:#73303a;color:#ff9aa4}.nav{display:flex;gap:8px;overflow:auto;padding-bottom:5px;margin-bottom:18px}.nav button{white-space:nowrap;border:1px solid var(--line);background:#09101a;color:var(--muted);padding:10px 14px;border-radius:12px}.nav button.active{color:white;border-color:#087fca;background:#08233a}.view{display:none}.view.active{display:block}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:linear-gradient(180deg,#101925,#0a1018);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow)}.metric .label{color:var(--muted);font-size:12px}.metric .value{font-size:23px;font-weight:800;margin-top:7px}.blue{color:#54c9ff}.green{color:var(--green)}.red{color:var(--red)}.yellow{color:var(--yellow)}.section{margin-top:16px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.section h2{font-size:17px;margin:0}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:650px}.table th,.table td{text-align:left;padding:11px 9px;border-bottom:1px solid #172231}.table th{color:var(--muted);font-size:12px}.badge{display:inline-block;padding:5px 8px;border-radius:999px;font-size:11px;font-weight:700}.badge.paid{background:#0b3828;color:#56e3a0}.badge.pending{background:#3b300a;color:#ffd873}.badge.overdue{background:#3b1016;color:#ff8894}.search{width:100%;background:#080e16;border:1px solid var(--line);color:white;padding:12px;border-radius:11px;margin-bottom:10px}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field label{display:block;color:var(--muted);font-size:12px;margin:0 0 6px}.field input,.field select,.field textarea{width:100%;background:#080e16;border:1px solid var(--line);color:white;border-radius:10px;padding:11px;outline:none}.field textarea{min-height:80px;resize:vertical}.formfull{grid-column:1/-1}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}.summary div{padding:12px;border-radius:11px;background:#080f18;border:1px solid var(--line)}.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:15px;z-index:20}.modal.open{display:flex}.modalbox{width:min(720px,100%);max-height:92vh;overflow:auto;background:#0a111a;border:1px solid #203349;border-radius:18px;padding:18px;box-shadow:0 30px 90px #000}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.modalhead h3{margin:0}.close{border:0;background:transparent;color:#9bb0c5;font-size:25px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.actions-cell{display:flex;gap:6px;flex-wrap:wrap}.empty{padding:28px;text-align:center;color:var(--muted)}.client-folder{border:1px solid var(--line);background:linear-gradient(180deg,#101925,#0a1018);border-radius:16px;margin-bottom:10px;overflow:hidden}.folder-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 15px;cursor:pointer}.folder-main{display:flex;align-items:center;gap:12px;min-width:0}.folder-icon{font-size:27px;line-height:1}.folder-name{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.folder-meta{color:var(--muted);font-size:12px;margin-top:3px}.folder-arrow{color:#7f98b2;font-size:20px;transition:transform .2s}.client-folder.open .folder-arrow{transform:rotate(90deg)}.folder-body{display:none;border-top:1px solid var(--line);padding:10px 12px 14px}.client-folder.open .folder-body{display:block}.sale-group{border:1px solid #172536;background:#080f18;border-radius:12px;margin:7px 0;overflow:hidden}.sale-group-head{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:11px 12px}.sale-group-title{font-weight:700}.sale-group-sub{color:var(--muted);font-size:11px;margin-top:3px}.mini-table{width:100%;border-collapse:collapse}.mini-table th,.mini-table td{padding:9px 8px;border-top:1px solid #172231;text-align:left;font-size:13px}.mini-table th{color:var(--muted);font-size:11px}.payment-choice{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.payment-choice label{border:1px solid var(--line);background:#080e16;border-radius:12px;padding:13px;cursor:pointer;display:flex;align-items:center;gap:9px}.payment-choice label:has(input:checked){border-color:#087fca;background:#08233a}.payment-choice input{accent-color:#08a8ff}.hidden-field{display:none!important}.install{display:none}.install.show{display:block}.notice{padding:11px 13px;background:#08233a;border:1px solid #0b6095;border-radius:11px;color:#bde9ff;margin-bottom:12px}.footer{margin-top:28px;text-align:center;color:#64778d;font-size:11px}@media(max-width:800px){.cards{grid-template-columns:repeat(2,1fr)}.formgrid{grid-template-columns:1fr}.summary{grid-template-columns:1fr}.top{align-items:flex-start}.actions .btn span{display:none}}@media(max-width:480px){.app{padding:12px 10px 90px}.cards{gap:8px}.card{padding:13px}.metric .value{font-size:19px}.brand img{width:45px;height:45px}.brand h1{font-size:18px}}
</style></head><body><main class="app"><header class="top"><div class="brand"><img src="logo.png" alt="Connect Store"><div><h1>Connect Store</h1><small>Controle comercial</small></div></div><div class="actions"><button id="installBtn" class="btn primary install">Instalar</button><button id="backupBtn" class="btn">Backup</button><button id="restoreBtn" class="btn">Restaurar</button><input id="restoreFile" type="file" accept="application/json" hidden></div></header><nav class="nav" id="nav"><button data-view="dashboard" class="active">Dashboard</button><button data-view="customers">Clientes</button><button data-view="sales">Vendas</button><button data-view="receivables">Parcelas</button></nav>
<section id="dashboard" class="view active"><div class="cards" id="metrics"></div><div class="section card"><div class="section-head"><h2>Próximos vencimentos</h2><button class="btn primary" onclick="openSale()">+ Nova venda</button></div><div id="dueList"></div></div></section>
<section id="customers" class="view"><div class="card"><div class="section-head"><h2>Clientes</h2><button class="btn primary" onclick="openCustomer()">+ Cliente</button></div><input id="customerSearch" class="search" placeholder="Buscar por nome ou telefone"><div class="tablewrap"><div id="customerList"></div></div></div></section>
<section id="sales" class="view"><div class="card"><div class="section-head"><h2>Vendas</h2><button class="btn primary" onclick="openSale()">+ Nova venda</button></div><input id="saleSearch" class="search" placeholder="Buscar venda, cliente ou produto"><div class="tablewrap"><div id="saleList"></div></div></div></section>
<section id="receivables" class="view"><div class="card"><div class="section-head"><h2>Controle de parcelas</h2></div><input id="installmentSearch" class="search" placeholder="Buscar cliente ou parcela"><div class="tablewrap"><div id="installmentList"></div></div></div></section>
<div class="footer">Connect Store • dados salvos neste dispositivo • funciona offline após o primeiro carregamento</div></main>
<div id="modal" class="modal"><div class="modalbox"><div class="modalhead"><h3 id="modalTitle"></h3><button class="close" onclick="closeModal()">×</button></div><div id="modalBody"></div></div></div>
<script>
const KEY='connect_store_db_v1';let db=loadDB(), deferredInstall=null;
function loadDB(){try{const data=JSON.parse(localStorage.getItem(KEY))||{customers:[],sales:[]};data.customers=data.customers||[];data.sales=data.sales||[];data.sales.forEach(s=>{s.paymentMethod=s.paymentMethod||((s.installmentsCount||0)>0?'parceladoPix':'avista');s.installments=s.installments||[];s.installments.forEach(i=>{if(!i.saleId)i.saleId=s.id})});return data}catch{return{customers:[],sales:[]}}}
function save(){localStorage.setItem(KEY,JSON.stringify(db));renderAll()}
function uid(p='id'){return p+'_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8)}
function moneyC(c){return (Number(c||0)/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}
function parseMoney(v){let s=String(v??'').trim().replace(/R\\$/g,'').replace(/\\s/g,'');if(s.includes(',')){s=s.replace(/\\./g,'').replace(',','.')}return Math.round((parseFloat(s)||0)*100)}
function isoDate(d){return d instanceof Date?new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10):d}
function today(){return isoDate(new Date())}
function brDate(d){if(!d)return '-';const [y,m,day]=d.split('-');return `${day}/${m}/${y}`}
function addMonths(dateStr,n){const d=new Date(dateStr+'T12:00:00');const day=d.getDate();d.setMonth(d.getMonth()+n);if(d.getDate()<day)d.setDate(0);return isoDate(d)}
function customer(id){return db.customers.find(x=>x.id===id)}
function sale(id){return db.sales.find(x=>x.id===id)}
function instStatus(i){if(i.paidAt)return 'paid';return i.dueDate<today()?'overdue':'pending'}
function statusLabel(s){return s==='paid'?'Paga':s==='overdue'?'Vencida':'Pendente'}
function totals(){let all=db.sales.flatMap(s=>s.installments||[]),received=db.sales.reduce((a,s)=>a+(s.entryCents||0),0)+all.filter(i=>i.paidAt).reduce((a,i)=>a+i.amountCents,0),open=all.filter(i=>!i.paidAt).reduce((a,i)=>a+i.amountCents,0),over=all.filter(i=>!i.paidAt&&i.dueDate<today()).reduce((a,i)=>a+i.amountCents,0),due=all.filter(i=>!i.paidAt&&i.dueDate===today()).reduce((a,i)=>a+i.amountCents,0),sales=db.sales.reduce((a,s)=>a+s.totalCents,0);return{all,received,open,over,due,sales}}
function renderAll(){renderMetrics();renderDue();renderCustomers();renderSales();renderInstallments()}
function renderMetrics(){const t=totals();document.getElementById('metrics').innerHTML=`<div class="card metric"><div class="label">Vendas cadastradas</div><div class="value blue">${moneyC(t.sales)}</div><small>${db.sales.length} venda(s)</small></div><div class="card metric"><div class="label">A receber</div><div class="value yellow">${moneyC(t.open)}</div><small>saldo parcelado</small></div><div class="card metric"><div class="label">Em atraso</div><div class="value red">${moneyC(t.over)}</div><small>parcelas vencidas</small></div><div class="card metric"><div class="label">Recebido</div><div class="value green">${moneyC(t.received)}</div><small>entradas + parcelas</small></div>`}
function renderDue(){let arr=totals().all.filter(i=>!i.paidAt).sort((a,b)=>a.dueDate.localeCompare(b.dueDate)).slice(0,8);const el=document.getElementById('dueList');if(!arr.length){el.innerHTML='<div class="empty">Nenhuma parcela pendente. Tudo em dia! 🎉</div>';return}el.innerHTML=`<div class="tablewrap"><table class="table"><thead><tr><th>Cliente</th><th>Parcela</th><th>Vencimento</th><th>Valor</th><th>Status</th><th></th></tr></thead><tbody>${arr.map(i=>{const s=sale(i.saleId),c=customer(s?.customerId),st=instStatus(i);return `<tr><td>${esc(c?.name||'Cliente removido')}</td><td>${i.number}/${s?.installmentsCount||'-'}</td><td>${brDate(i.dueDate)}</td><td>${moneyC(i.amountCents)}</td><td><span class="badge ${st}">${statusLabel(st)}</span></td><td><button class="btn" onclick="payInstallment('${i.saleId}','${i.id}')">Pagar</button></td></tr>`}).join('')}</tbody></table></div>`}
function renderCustomers(){const q=(document.getElementById('customerSearch')?.value||'').toLowerCase();let arr=db.customers.filter(c=>(c.name+' '+(c.phone||'')).toLowerCase().includes(q));const el=document.getElementById('customerList');if(!arr.length){el.innerHTML='<div class="empty">Nenhum cliente encontrado.</div>';return}el.innerHTML=`<table class="table"><thead><tr><th>Nome</th><th>Telefone</th><th>Vendas</th><th>Saldo</th><th></th></tr></thead><tbody>${arr.map(c=>{let ss=db.sales.filter(s=>s.customerId===c.id),open=ss.flatMap(s=>s.installments||[]).filter(i=>!i.paidAt).reduce((a,i)=>a+i.amountCents,0);return `<tr><td><b>${esc(c.name)}</b></td><td>${esc(c.phone||'-')}</td><td>${ss.length}</td><td>${moneyC(open)}</td><td class="actions-cell"><button class="btn" onclick="openCustomer('${c.id}')">Editar</button><button class="btn primary" onclick="openSale('${c.id}')">Venda</button></td></tr>`}).join('')}</tbody></table>`}
function renderSales(){const q=(document.getElementById('saleSearch')?.value||'').toLowerCase();let arr=db.sales.filter(s=>{const c=customer(s.customerId);return (s.description+' '+(c?.name||'')).toLowerCase().includes(q)}).sort((a,b)=>b.createdAt.localeCompare(a.createdAt));const el=document.getElementById('saleList');if(!arr.length){el.innerHTML='<div class="empty">Nenhuma venda cadastrada.</div>';return}el.innerHTML=`<table class="table"><thead><tr><th>Cliente</th><th>Descrição</th><th>Total</th><th>Pagamento</th><th>Parcelas</th><th>Saldo</th><th></th></tr></thead><tbody>${arr.map(s=>{let open=(s.installments||[]).filter(i=>!i.paidAt).reduce((a,i)=>a+i.amountCents,0);return `<tr><td>${esc(customer(s.customerId)?.name||'Cliente removido')}</td><td>${esc(s.description)}</td><td>${moneyC(s.totalCents)}</td><td>${s.paymentMethod==='avista'?'À vista':'Parcelado no Pix'}</td><td>${s.installmentsCount||'-'}</td><td>${moneyC(open)}</td><td><button class="btn" onclick="viewSale('${s.id}')">Ver</button></td></tr>`}).join('')}</tbody></table>`}
function renderInstallments(){const q=(document.getElementById('installmentSearch')?.value||'').toLowerCase();const groups=db.customers.map(c=>{const sales=db.sales.filter(s=>s.customerId===c.id&&((s.installments||[]).length));const installments=sales.flatMap(s=>(s.installments||[]).map(i=>({...i,saleId:s.id}))).filter(i=>{const s=sale(i.saleId);return ((c.name||'')+' '+(s?.description||'')).toLowerCase().includes(q)});return {c,sales,installments}}).filter(g=>g.installments.length);const el=document.getElementById('installmentList');if(!groups.length){el.innerHTML='<div class="empty">Nenhuma parcela cadastrada.</div>';return}el.innerHTML=groups.map(g=>{const open=g.installments.filter(i=>!i.paidAt).reduce((a,i)=>a+i.amountCents,0),paid=g.installments.filter(i=>i.paidAt).length;return `<div class="client-folder" id="folder_${g.c.id}"><div class="folder-head" onclick="toggleFolder('${g.c.id}')"><div class="folder-main"><div class="folder-icon">📁</div><div><div class="folder-name">${esc(g.c.name)}</div><div class="folder-meta">${g.sales.length} venda(s) • ${g.installments.length} parcela(s) • ${paid} paga(s) • ${moneyC(open)} em aberto</div></div></div><div class="folder-arrow">›</div></div><div class="folder-body">${g.sales.map(s=>{const its=(s.installments||[]).filter(i=>{const txt=((g.c.name||'')+' '+(s.description||'')).toLowerCase();return !q||txt.includes(q)});if(!its.length)return '';const openSale=its.filter(i=>!i.paidAt).reduce((a,i)=>a+i.amountCents,0);return `<div class="sale-group"><div class="sale-group-head"><div><div class="sale-group-title">${esc(s.description)}</div><div class="sale-group-sub">${s.installmentsCount} parcela(s) • Saldo ${moneyC(openSale)} • ${s.paymentMethod==='avista'?'À vista':'Parcelado no Pix'}</div></div><button class="btn" onclick="event.stopPropagation();viewSale('${s.id}')">Ver venda</button></div><div class="tablewrap"><table class="mini-table"><thead><tr><th>#</th><th>Vencimento</th><th>Valor</th><th>Status</th><th>Ação</th></tr></thead><tbody>${its.map(i=>{const st=instStatus(i);return `<tr><td>${i.number}/${s.installmentsCount}</td><td>${brDate(i.dueDate)}</td><td>${moneyC(i.amountCents)}</td><td><span class="badge ${st}">${statusLabel(st)}</span></td><td class="actions-cell">${!i.paidAt?`<button class="btn" onclick="payInstallment('${s.id}','${i.id}')">Pagar</button>`:''}<button class="btn" onclick="whats('${s.id}','${i.id}')">WhatsApp</button></td></tr>`}).join('')}</tbody></table></div></div>`}).join('')}</div></div>`}).join('')}
function toggleFolder(id){const el=document.getElementById('folder_'+id);if(el)el.classList.toggle('open')}
function openCustomer(id=''){const c=customer(id)||{name:'',phone:'',cpf:'',address:'',notes:''};modal('Cliente',`<div class="formgrid"><div class="field formfull"><label>Nome completo *</label><input id="c_name" value="${attr(c.name)}"></div><div class="field"><label>Telefone / WhatsApp</label><input id="c_phone" inputmode="tel" value="${attr(c.phone)}"></div><div class="field"><label>CPF</label><input id="c_cpf" value="${attr(c.cpf)}"></div><div class="field formfull"><label>Endereço</label><input id="c_address" value="${attr(c.address)}"></div><div class="field formfull"><label>Observações</label><textarea id="c_notes">${esc(c.notes)}</textarea></div></div><div class="row" style="margin-top:15px"><button class="btn primary" onclick="saveCustomer('${id}')">Salvar cliente</button>${id?`<button class="btn danger" onclick="deleteCustomer('${id}')">Excluir</button>`:''}</div>`)}
function saveCustomer(id){const name=document.getElementById('c_name').value.trim();if(!name)return alert('Informe o nome do cliente.');const obj={id:id||uid('cli'),name,phone:document.getElementById('c_phone').value.trim(),cpf:document.getElementById('c_cpf').value.trim(),address:document.getElementById('c_address').value.trim(),notes:document.getElementById('c_notes').value.trim(),createdAt:id?(customer(id)?.createdAt||new Date().toISOString()):new Date().toISOString()};if(id)db.customers=db.customers.map(c=>c.id===id?obj:c);else db.customers.push(obj);save();closeModal()}
function deleteCustomer(id){if(db.sales.some(s=>s.customerId===id))return alert('Este cliente possui vendas. Para preservar o histórico, não é permitido excluí-lo.');if(confirm('Excluir este cliente?')){db.customers=db.customers.filter(c=>c.id!==id);save();closeModal()}}
function openSale(customerId=''){if(!db.customers.length)return alert('Cadastre um cliente primeiro.');const opts=db.customers.map(c=>`<option value="${c.id}" ${c.id===customerId?'selected':''}>${esc(c.name)}</option>`).join('');const d=addMonths(today(),1);modal('Nova venda',`<div class="notice">Escolha primeiro a forma de pagamento. No parcelado via Pix, você poderá usar de 1 a 10 parcelas.</div><div class="formgrid"><div class="field formfull"><label>Cliente *</label><select id="s_customer">${opts}</select></div><div class="field formfull"><label>Produto / serviço *</label><input id="s_desc" placeholder="Ex.: Câmera Wi-Fi Jortan"></div><div class="field formfull"><label>Forma de pagamento *</label><div class="payment-choice"><label><input type="radio" name="paymentMethod" value="avista" checked onchange="togglePaymentFields()"> <span><b>À vista</b><br><small>Pagamento integral na venda</small></span></label><label><input type="radio" name="paymentMethod" value="parceladoPix" onchange="togglePaymentFields()"> <span><b>Parcelado no Pix</b><br><small>Controle de 1 a 10 parcelas</small></span></label></div></div><div class="field"><label>Valor total (R$) *</label><input id="s_total" inputmode="decimal" placeholder="0,00" oninput="previewSale()"></div><div id="parcelFields" class="formgrid formfull hidden-field"><div class="field"><label>Entrada (R$)</label><input id="s_entry" inputmode="decimal" value="0,00" oninput="previewSale()"></div><div class="field"><label>Nº de parcelas</label><select id="s_n" onchange="previewSale()">${Array.from({length:10},(_,i)=>`<option>${i+1}</option>`).join('')}</select></div><div class="field formfull"><label>1º vencimento</label><input id="s_date" type="date" value="${d}" onchange="previewSale()"></div></div><div class="field formfull"><div id="salePreview" class="summary"></div></div></div><div class="row"><button class="btn primary" onclick="saveSale()">Registrar venda</button></div>`);togglePaymentFields();previewSale()}
function getPaymentMethod(){return document.querySelector('input[name="paymentMethod"]:checked')?.value||'avista'}
function togglePaymentFields(){const parcel=document.getElementById('parcelFields');if(!parcel)return;parcel.classList.toggle('hidden-field',getPaymentMethod()!=='parceladoPix');previewSale()}
function previewSale(){const box=document.getElementById('salePreview');if(!box)return;const t=parseMoney(document.getElementById('s_total')?.value);if(t<=0){box.innerHTML='';return}if(getPaymentMethod()==='avista'){box.innerHTML=`<div>Forma de pagamento<br><b>À vista</b></div><div>Valor recebido<br><b>${moneyC(t)}</b></div><div>Saldo<br><b>${moneyC(0)}</b></div>`;return}const e=parseMoney(document.getElementById('s_entry')?.value),n=Number(document.getElementById('s_n')?.value||1),rem=Math.max(0,t-e);const base=Math.floor(rem/n),rest=rem-base*n;box.innerHTML=`<div>Saldo parcelado<br><b>${moneyC(rem)}</b></div><div>Cada parcela<br><b>${moneyC(base)}</b></div><div>Diferença de centavos<br><b>${moneyC(rest)}</b></div>`}
function saveSale(){const customerId=document.getElementById('s_customer').value,description=document.getElementById('s_desc').value.trim(),total=parseMoney(document.getElementById('s_total').value),method=getPaymentMethod();if(!customerId||!description||total<=0)return alert('Preencha os dados corretamente.');let entry=0,n=0,first=null,installments=[];if(method==='avista'){entry=total}else{entry=parseMoney(document.getElementById('s_entry').value);n=Number(document.getElementById('s_n').value);first=document.getElementById('s_date').value;if(entry<0||entry>=total||!first)return alert('No parcelado, a entrada deve ser menor que o valor total e o vencimento deve ser informado.');const rem=total-entry,base=Math.floor(rem/n),rest=rem-base*n;const saleId=uid('ven');installments=Array.from({length:n},(_,idx)=>({id:uid('par'),saleId,number:idx+1,amountCents:base+(idx===0?rest:0),dueDate:addMonths(first,idx),paidAt:null}));db.sales.push({id:saleId,customerId,description,totalCents:total,entryCents:entry,paymentMethod:method,installmentsCount:n,firstDueDate:first,createdAt:new Date().toISOString(),installments});save();closeModal();return}db.sales.push({id:uid('ven'),customerId,description,totalCents:total,entryCents:total,paymentMethod:method,installmentsCount:0,firstDueDate:null,createdAt:new Date().toISOString(),installments:[]});save();closeModal()}
function payInstallment(sid,iid){const s=sale(sid),i=s?.installments?.find(x=>x.id===iid);if(!i||i.paidAt)return;if(confirm(`Confirmar recebimento de ${moneyC(i.amountCents)} da parcela ${i.number}?`)){i.paidAt=today();save()}}
function viewSale(id){const s=sale(id),c=customer(s.customerId);if(!s)return;const open=(s.installments||[]).filter(i=>!i.paidAt).reduce((a,i)=>a+i.amountCents,0);const rows=(s.installments||[]).length?s.installments.map(i=>{const st=instStatus(i);return `<tr><td>${i.number}/${s.installmentsCount}</td><td>${brDate(i.dueDate)}</td><td>${moneyC(i.amountCents)}</td><td><span class="badge ${st}">${statusLabel(st)}</span></td><td>${!i.paidAt?`<button class="btn" onclick="payInstallment('${s.id}','${i.id}');viewSale('${s.id}')">Pagar</button>`:''}<button class="btn" onclick="whats('${s.id}','${i.id}')">WhatsApp</button></td></tr>`}).join(''):`<tr><td colspan="5" style="color:var(--muted);text-align:center">Venda paga à vista. Não há parcelas.</td></tr>`;modal('Detalhes da venda',`<div class="card"><b>${esc(c?.name||'-')}</b><br>${esc(s.description)}<br><small>Venda em ${brDate(s.createdAt.slice(0,10))} • ${s.paymentMethod==='avista'?'À vista':'Parcelado no Pix'}</small><hr><div class="summary"><div>Total<br><b>${moneyC(s.totalCents)}</b></div><div>Recebido<br><b>${moneyC(s.entryCents)}</b></div><div>Saldo<br><b>${moneyC(open)}</b></div></div><div class="tablewrap"><table class="table"><thead><tr><th>#</th><th>Vencimento</th><th>Valor</th><th>Status</th><th></th></tr></thead><tbody>${rows}</tbody></table></div><div class="row" style="margin-top:14px"><button class="btn" onclick="printReceipt('${s.id}')">Imprimir recibo</button></div></div>`)}
function whats(sid,iid){const s=sale(sid),i=s?.installments?.find(x=>x.id===iid),c=customer(s?.customerId);if(!s||!i||!c?.phone)return alert('Cadastre o telefone/WhatsApp do cliente.');const num=c.phone.replace(/\D/g,'');const phone=num.startsWith('55')?num:'55'+num;const todayStr=today();const overdue=i.dueDate<todayStr;const intro=overdue?`Passando para te avisar que a parcela ${i.number} de ${s.installmentsCount}, referente a ${s.description}, está em aberto.`:`Passando só para te lembrar que a parcela ${i.number} de ${s.installmentsCount}, referente a ${s.description}, vence em ${brDate(i.dueDate)}.`;const txt=`Oi, ${c.name}! 😊 Tudo bem?\n\nAqui é da Connect Store. ${intro}\n\n💰 Valor: ${moneyC(i.amountCents)}\n📅 Vencimento: ${brDate(i.dueDate)}\n\nSe você já realizou o pagamento, pode desconsiderar esta mensagem. E se precisar de qualquer coisa, é só me chamar! 😊\n\nObrigado pela preferência!\nConnect Store`;window.open(`https://wa.me/${phone}?text=${encodeURIComponent(txt)}`,'_blank')}
function printReceipt(sid){const s=sale(sid),c=customer(s.customerId);const w=window.open('','_blank');if(!w)return;const saldo=(s.installments||[]).filter(i=>!i.paidAt).reduce((a,i)=>a+i.amountCents,0);const rows=(s.installments||[]).map(i=>`<tr><td>${i.number}/${s.installmentsCount}</td><td>${brDate(i.dueDate)}</td><td>${moneyC(i.amountCents)}</td><td>${i.paidAt?'Paga em '+brDate(i.paidAt):statusLabel(instStatus(i))}</td></tr>`).join('');w.document.write(`<html><head><title>Recibo Connect Store</title><style>body{font:14px Arial;padding:30px;max-width:700px;margin:auto}h1{font-size:22px}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #ddd;text-align:left}.total{font-size:20px;font-weight:bold}</style></head><body><h1>CONNECT STORE</h1><h2>Comprovante de venda</h2><p><b>Cliente:</b> ${esc(c?.name||'-')}<br><b>Produto/serviço:</b> ${esc(s.description)}<br><b>Forma de pagamento:</b> ${s.paymentMethod==='avista'?'À vista':'Parcelado no Pix'}<br><b>Data:</b> ${brDate(s.createdAt.slice(0,10))}</p><p><b>Total:</b> ${moneyC(s.totalCents)}<br><b>Recebido/entrada:</b> ${moneyC(s.entryCents)}<br><b>Saldo:</b> ${moneyC(saldo)}</p>${rows?`<table><tr><th>Parcela</th><th>Vencimento</th><th>Valor</th><th>Status</th></tr>${rows}</table>`:''}<p style="margin-top:40px">Connect Store — Controle comercial</p><script>window.print()<\/script></body></html>`);w.document.close()}
function backup(){const blob=new Blob([JSON.stringify({app:'Connect Store',version:1,exportedAt:new Date().toISOString(),data:db},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='connect-store-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function restore(file){const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.data?.customers||!x.data?.sales)throw 0;if(!confirm('Restaurar este backup? Os dados atuais serão substituídos.'))return;db=x.data;save();alert('Backup restaurado com sucesso.')}catch{alert('Arquivo de backup inválido.')}};r.readAsText(file)}
function modal(title,body){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=body;document.getElementById('modal').classList.add('open')}
function closeModal(){document.getElementById('modal').classList.remove('open')}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function attr(s){return esc(s).replace(/\\n/g,' ')}
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.getElementById(b.dataset.view).classList.add('active')});document.getElementById('customerSearch').oninput=renderCustomers;document.getElementById('saleSearch').oninput=renderSales;document.getElementById('installmentSearch').oninput=renderInstallments;document.getElementById('backupBtn').onclick=backup;document.getElementById('restoreBtn').onclick=()=>document.getElementById('restoreFile').click();document.getElementById('restoreFile').onchange=e=>e.target.files[0]&&restore(e.target.files[0]);document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')closeModal()};window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;document.getElementById('installBtn').classList.add('show')});document.getElementById('installBtn').onclick=async()=>{if(!deferredInstall)return;deferredInstall.prompt();deferredInstall=null};
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});renderAll();
</script></body></html>
